services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pqrsdf-sqlserver-2022
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong@Passw0rd!\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pqrsdf-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'YourStrong@Passw0rd!' -C -Q \"IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'PqrsdfDb') BEGIN CREATE DATABASE [PqrsdfDb]; PRINT 'Database PqrsdfDb created successfully'; END\"
      "
    restart: "no"

volumes:
  sqlserver-data:
    driver: local
