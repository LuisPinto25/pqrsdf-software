services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pqrsdf-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong@Passw0rd!\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - pqrsdf-network

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pqrsdf-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'YourStrong@Passw0rd!' -C -Q \"IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'PqrsdfDb') BEGIN CREATE DATABASE [PqrsdfDb]; PRINT 'Database PqrsdfDb created successfully'; END\"
      "
    restart: "no"
    networks:
      - pqrsdf-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pqrsdf-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5023
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=PqrsdfDb;User Id=sa;Password=YourStrong@Passw0rd!;MultipleActiveResultSets=true;TrustServerCertificate=True
    ports:
      - "5023:5023"
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - pqrsdf-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pqrsdf-frontend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:5023
      - OPENAPI_URL=http://backend:5023/swagger/v1/swagger.json
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pqrsdf-network

volumes:
  sqlserver-data:
    driver: local

networks:
  pqrsdf-network:
    driver: bridge
